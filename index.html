<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E56" id="tc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sarftamin">
<title>Sarftamin</title>
<script>
(function(){
  var d=document.documentElement,t=null,l=null;
  try{t=localStorage.getItem('sf_theme');l=localStorage.getItem('sf_lang')}catch(e){}
  if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
  d.setAttribute('data-theme',t);
  if(l==='en'){d.lang='en';d.dir='ltr'}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2F0;--sf:#FFFFFF;--sf2:#F5F8F7;--ink:#0F2420;--ink2:#4B605B;--ink3:#7F918C;--ln:#D3DFDA;--jd:#0F6E56;--hd:#0F6E56;--rs:#0F6E56;--mint:#C6EEE0;--ring:rgba(15,110,86,.22)}
:root[data-theme="dark"]{--bg:#0C1513;--sf:#14211E;--sf2:#101B18;--ink:#E8F3EF;--ink2:#A8BBB5;--ink3:#7A8E87;--ln:#274039;--jd:#3CC2A0;--hd:#0C5543;--rs:#0C5543;--mint:#C6EEE0;--ring:rgba(60,194,160,.28)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.hd{background:var(--hd);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 56px}
.hd-in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:14px;flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.28)}
.ttl{flex:1;min-width:0}
.hd h1{font-size:18px;font-weight:700;margin:0;line-height:1.4}
.hd p{margin:1px 0 0;font-size:13px;color:var(--mint);opacity:.95}
.tools{display:flex;gap:8px;flex:none}
.tb{width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0}
.tb:hover{background:rgba(255,255,255,.25)}
.tb:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tb svg{display:block}
.logo-btn{border:none;background:none;padding:0;display:block;flex:none;border-radius:14px;cursor:pointer}
.logo-btn:hover .logo{filter:brightness(1.12)}
.logo-btn:active{transform:scale(.95)}
.logo-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.infow{position:relative}
.pop{display:none;position:absolute;top:100%;inset-inline-end:0;padding-top:10px;z-index:40;width:min(312px,calc(100vw - 28px));color:var(--ink);text-align:start}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px 8px;box-shadow:0 16px 44px rgba(0,0,0,.3)}
.infow.open .pop{display:block}
@media (hover:hover) and (pointer:fine){.infow:hover .pop{display:block}}
.hd .pt{font-size:14px;font-weight:700;color:var(--ink);opacity:1;margin:0 0 8px}
.kr{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--ln)}
.kk{display:flex;align-items:center;gap:5px;direction:ltr;min-width:120px;flex:none}
.key{min-width:42px;height:34px;padding:0 11px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--sf2);border:1px solid var(--ln);border-bottom-width:3px;border-radius:8px;cursor:pointer}
.key:hover{border-color:var(--jd);color:var(--jd)}
.key:active{transform:translateY(2px);border-bottom-width:1px}
.key:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring);border-color:var(--jd)}
.pl{color:var(--ink3);font-size:13px}
.kd{font-size:14px;color:var(--ink2);line-height:1.4}
.tb .ico-sun{display:none}
:root[data-theme="dark"] .tb .ico-sun{display:block}
:root[data-theme="dark"] .tb .ico-moon{display:none}
.app{width:100%;flex:1;display:flex;flex-direction:column;max-width:480px;margin:-38px auto 0;padding:0 14px 8px}
.grid{display:grid;gap:14px;margin-bottom:22px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px}
.sec{font-size:14px;font-weight:700;margin:0 0 12px}
.row{display:flex;direction:ltr;align-items:flex-end;gap:8px}
.f{flex:1;min-width:0}
.f label{display:block;font-size:13px;color:var(--ink2);margin:0 0 6px;text-align:center}
.x{padding-bottom:15px;color:var(--ink3);font-size:18px}
.sep{height:1px;background:var(--ln);margin:16px 0}
input{width:100%;height:52px;font:inherit;font-size:24px;font-weight:500;text-align:center;color:var(--ink);background:var(--sf2);border:1.5px solid var(--ln);border-radius:12px;font-variant-numeric:tabular-nums}
input::placeholder{color:var(--ink3);opacity:.5}
input:focus{outline:none;border-color:var(--jd);box-shadow:0 0 0 4px var(--ring);background:var(--sf)}
.btn{width:100%;height:46px;margin-top:16px;font:inherit;font-size:15px;font-weight:500;color:var(--ink2);background:transparent;border:1.5px solid var(--ln);border-radius:12px;cursor:pointer}
.btn:hover{border-color:var(--jd);color:var(--jd)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--ring);border-color:var(--jd)}
.btn:active{transform:scale(.99)}
.res{position:relative;background:var(--sf);border:1.5px dashed var(--ln);border-radius:18px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;color:var(--ink3)}
.res.ok{background:var(--rs);border:1px solid var(--rs);color:#fff;cursor:pointer;transition:filter .15s;box-shadow:0 14px 34px rgba(4,50,40,.3)}
.res.ok:hover{filter:brightness(1.08)}
.tiles{display:flex;align-items:stretch;justify-content:center;flex-wrap:wrap;gap:10px}
.t{justify-content:center;background:rgba(255,255,255,.13);border-radius:18px;padding:16px 20px 14px;min-width:116px;display:flex;flex-direction:column;align-items:center}
.ur{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.t svg{display:block;flex:none;opacity:.9}
.t .ib{width:26px;height:auto}
.t .is{width:48px;height:auto}
.t .v{font-size:68px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.t .u{font-size:21px;font-weight:500;color:var(--mint)}
.plus{font-size:30px;font-weight:500;opacity:.7;align-self:center}
.sub{font-size:15px;font-weight:400;color:var(--mint);opacity:.92;margin-top:12px}
.hf{font-size:13px;font-weight:400;color:var(--mint);opacity:.85;margin-top:14px}
.res .ex{position:absolute;top:14px;inset-inline-end:14px;opacity:.6}
.res .em{opacity:.35}
.info{text-align:center}
.info{display:flex;flex-direction:column;align-items:center}
.half,.tot{background:var(--bg);color:var(--ink2);padding:3px 14px;border-radius:999px;margin:0}
.half{font-size:15px;margin-top:14px}
.tot{font-size:12.5px;margin-top:6px}
.half:empty,.tot:empty{display:none}
.ft{text-align:center;font-size:11.5px;font-weight:400;color:var(--ink3);opacity:.85;align-self:center;background:var(--bg);padding:4px 16px;border-radius:999px;margin:auto 0 14px}
.ov{display:none;position:fixed;inset:0;z-index:50;background:var(--rs);color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer}
.ov.on{display:flex;animation:ovin .18s ease-out}
@keyframes ovin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ov.on{animation:none}.res.ok{transition:none}}
.ov .tiles{gap:clamp(10px,3vw,28px)}
.ov .t{padding:clamp(16px,3vw,34px) clamp(18px,4vw,48px) clamp(14px,2.6vw,30px);min-width:clamp(130px,34vw,300px);border-radius:clamp(20px,4vw,36px)}
.ov .ur{gap:clamp(8px,2vw,18px);margin-top:clamp(6px,1.4vw,14px)}
.ov .t .ib{width:clamp(30px,6.5vw,64px);height:auto}
.ov .t .is{width:clamp(56px,12.5vw,118px);height:auto}
.ov .t .v{font-size:clamp(84px,24vw,230px)}
.ov .t .u{font-size:clamp(24px,6vw,52px)}
.ov .plus{font-size:clamp(34px,8vw,72px)}
.ov .sub{font-size:clamp(17px,3.4vw,30px);margin-top:clamp(14px,3vw,28px)}
.ov .hf{font-size:clamp(14px,2.6vw,22px);margin-top:clamp(16px,3.4vw,32px)}
.ov .cl{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-size:22px;cursor:pointer}
@media (min-width:880px){
  body{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27180%27%20height%3D%27180%27%20viewBox%3D%270%200%20180%20180%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23DAE7E2%27%20stroke-width%3D%271.6%27%20stroke-linecap%3D%27round%27%3E%3Cg%20transform%3D%27rotate%28-40%2045%2045%29%27%3E%3Crect%20x%3D%2725%27%20y%3D%2736%27%20width%3D%2740%27%20height%3D%2718%27%20rx%3D%279%27/%3E%3Cpath%20d%3D%27M45%2036v18%27/%3E%3C/g%3E%3Cg%20transform%3D%27rotate%2835%20135%20125%29%27%3E%3Crect%20x%3D%27115%27%20y%3D%27116%27%20width%3D%2740%27%20height%3D%2718%27%20rx%3D%279%27/%3E%3Cpath%20d%3D%27M135%20116v18%27/%3E%3C/g%3E%3C/g%3E%3Cg%20fill%3D%27%23DAE7E2%27%3E%3Ccircle%20cx%3D%27140%27%20cy%3D%2736%27%20r%3D%272.2%27/%3E%3Ccircle%20cx%3D%27152%27%20cy%3D%2736%27%20r%3D%272.2%27/%3E%3Ccircle%20cx%3D%27164%27%20cy%3D%2736%27%20r%3D%272.2%27/%3E%3Ccircle%20cx%3D%2720%27%20cy%3D%27142%27%20r%3D%272.2%27/%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%27142%27%20r%3D%272.2%27/%3E%3Ccircle%20cx%3D%2744%27%20cy%3D%27142%27%20r%3D%272.2%27/%3E%3C/g%3E%3C/svg%3E")}
  :root[data-theme="dark"] body{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27180%27%20height%3D%27180%27%20viewBox%3D%270%200%20180%20180%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%231B2E28%27%20stroke-width%3D%271.6%27%20stroke-linecap%3D%27round%27%3E%3Cg%20transform%3D%27rotate%28-40%2045%2045%29%27%3E%3Crect%20x%3D%2725%27%20y%3D%2736%27%20width%3D%2740%27%20height%3D%2718%27%20rx%3D%279%27/%3E%3Cpath%20d%3D%27M45%2036v18%27/%3E%3C/g%3E%3Cg%20transform%3D%27rotate%2835%20135%20125%29%27%3E%3Crect%20x%3D%27115%27%20y%3D%27116%27%20width%3D%2740%27%20height%3D%2718%27%20rx%3D%279%27/%3E%3Cpath%20d%3D%27M135%20116v18%27/%3E%3C/g%3E%3C/g%3E%3Cg%20fill%3D%27%231B2E28%27%3E%3Ccircle%20cx%3D%27140%27%20cy%3D%2736%27%20r%3D%272.2%27/%3E%3Ccircle%20cx%3D%27152%27%20cy%3D%2736%27%20r%3D%272.2%27/%3E%3Ccircle%20cx%3D%27164%27%20cy%3D%2736%27%20r%3D%272.2%27/%3E%3Ccircle%20cx%3D%2720%27%20cy%3D%27142%27%20r%3D%272.2%27/%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%27142%27%20r%3D%272.2%27/%3E%3Ccircle%20cx%3D%2744%27%20cy%3D%27142%27%20r%3D%272.2%27/%3E%3C/g%3E%3C/svg%3E")}
  .hd{padding:calc(26px + env(safe-area-inset-top,0px)) 28px 30px}
  .hd-in{max-width:1000px;gap:16px}
  .hd h1{font-size:25px}
  .hd p{font-size:15px}
  .logo{width:56px;height:56px;border-radius:16px}
  .tb{width:44px;height:44px}
  .app{max-width:1056px;margin-top:26px;padding:0 28px 8px}
  .grid{grid-template-columns:1.05fr 1fr;gap:24px;align-items:stretch;min-height:clamp(440px,54vh,660px)}
  .card{padding:28px;display:flex;flex-direction:column;justify-content:center}
  input{height:clamp(58px,7vh,78px);font-size:clamp(26px,3.3vh,34px)}
  .sep{margin:clamp(22px,3vh,38px) 0}
  .btn{height:clamp(50px,6vh,62px);margin-top:clamp(22px,3vh,34px)}
  .out{display:flex;flex-direction:column}
  .res{flex:1;min-height:300px}
  .t{padding:clamp(20px,3vh,34px) clamp(30px,3vw,46px) clamp(18px,2.6vh,30px);min-width:150px}
  .t .v{font-size:clamp(88px,13vh,150px)}
  .t .u{font-size:clamp(25px,3.2vh,34px)}
  .t .ib{width:30px}
  .t .is{width:54px}
  .plus{font-size:36px}
  .hf{font-size:14px}
}
@media (min-width:1280px){
  .hd-in{max-width:1120px}
  .app{max-width:1176px}
}
@media (min-width:1700px){
  .hd-in{max-width:1240px}
  .app{max-width:1296px}
}
}
</style>

<div class="ov" id="ov"><button class="cl" id="cl" type="button" aria-label="Close">✕</button><div id="ovc"></div></div>
<script>
var ids=['a','b','c','x','y'];
var LANG='ar';
var T={
 ar:{title:'حاسبة صرف علاج التأمين الصحي',sub:'(علاء راضي)',dose:'الجرعة',box:'العلبة',pills:'قرص',times:'مرة يوميًا',days:'يوم',boxPills:'أقراص العلبة',boxStrips:'شرايط العلبة',clear:'مسح الكل',kbTitle:'اختصارات لوحة المفاتيح',k_next:'الخانة اللي بعدها',k_prev:'الرجوع للخانة السابقة',k_enter:'إظهار النتيجة',k_esc:'إغلاق النتيجة',k_clear:'مسح الكل',ft:'تصميم وتنفيذ : (علاء راضي - Alaa Rady)'},
 en:{title:'Health Insurance Medication Dispensing Calculator',sub:'(Alaa Rady)',dose:'Dose',box:'Box',pills:'Tablets',times:'Times a day',days:'Days',boxPills:'Tablets per box',boxStrips:'Strips per box',clear:'Clear all',kbTitle:'Keyboard shortcuts',k_next:'Next field',k_prev:'Previous field',k_enter:'Show result',k_esc:'Close result',k_clear:'Clear all',ft:'Design & development: Alaa Rady'}
};
var EXP='<svg class="ex" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
var EMPTY='<svg class="em" viewBox="0 0 32 32" width="64" height="64" aria-hidden="true"><g transform="rotate(-40 16 16)"><rect x="2" y="10" width="28" height="12" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 10v12" stroke="currentColor" stroke-width="1.6"/></g></svg>';
function $(i){return document.getElementById(i)}
function num(id){
  var v=$(id).value;
  v=v.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[٫,،]/g,'.').replace(/\s/g,'');
  var n=parseFloat(v);
  return isNaN(n)?0:n;
}
function fmt(n){return String(Math.round(n*100)/100)}
function boxW(b){if(LANG==='en')return b+(b===1?' box':' boxes');return b===1?'علبة':(b===2?'علبتين':b+' علب')}
function stripW(s){if(LANG==='en')return s+(s===1?' strip':' strips');return s===1?'شريط':(s===2?'شريطين':s+' شرايط')}
var cur='',lastEl=null,lastIn='a';
function fine(){return window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches}
function openOv(){
  if(!cur)return;
  var ae=document.activeElement;
  lastEl=(ae&&ae.tagName==='INPUT')?ae:$(lastIn);
  if(ae&&ae.blur)ae.blur();
  $('ov').className='ov on';
  try{location.hash='r'}catch(e){}
}
function closeOv(){
  var o=$('ov');
  if(o.className.indexOf('on')<0)return;
  o.className='ov';
  try{if(location.hash==='#r')history.back()}catch(e){}
  if(lastEl&&fine())lastEl.focus();
}
function unitW(kind,n){
  if(LANG==='en')return kind==='box'?(n===1?'box':'boxes'):(n===1?'strip':'strips');
  if(kind==='box')return n===1?'علبة':(n===2?'علبتين':'علب');
  return n===1?'شريط':(n===2?'شريطين':'شرايط');
}
var IC_BOX='<svg class="ib" viewBox="0 0 48 56" width="29" height="34" aria-hidden="true"><path d="M6 10 14 6h28l-8 4z" fill="#E6F7F1"/><path d="M34 10 42 6v40l-8 4z" fill="#A9DCC8"/><rect x="6" y="10" width="28" height="40" rx="1.5" fill="#fff"/><path d="M6 11.5A1.5 1.5 0 0 1 7.5 10h25a1.5 1.5 0 0 1 1.5 1.5V18H6z" fill="var(--rs)"/><rect x="10" y="13" width="13" height="2" rx="1" fill="#fff" opacity=".85"/><path d="M18 24h4v4.5h4.5v4H22V37h-4v-4.5h-4.5v-4H18z" fill="var(--rs)"/><rect x="10" y="41" width="20" height="2" rx="1" fill="var(--rs)" opacity=".35"/><rect x="10" y="45" width="12" height="2" rx="1" fill="var(--rs)" opacity=".35"/></svg>';
var IC_STRIP=(function(){
  var g='';
  for(var r=0;r<2;r++){for(var c=0;c<5;c++){
    var cx=17+c*21.5,cy=17+r*22;
    g+='<rect x="'+(cx-9.5)+'" y="'+(cy-6.5)+'" width="19" height="13" rx="6.5" fill="none" stroke="var(--rs)" stroke-opacity=".3" stroke-width="1.2"/>';
    g+='<path d="M'+cx+' '+(cy-4.5)+'h-4a4.5 4.5 0 0 0 0 9h4z" fill="var(--rs)"/>';
    g+='<path d="M'+cx+' '+(cy-4.5)+'h4a4.5 4.5 0 0 1 0 9h-4z" fill="#8FD3BC"/>';
  }}
  return '<svg class="is" viewBox="0 0 120 56" width="92" height="43" aria-hidden="true"><rect x="1.5" y="1.5" width="117" height="53" rx="6" fill="#F4F7F6" stroke="#CFE0DA"/>'+g+'</svg>';
})();
function tile(n,kind){return '<div class="t"><div class="v">'+n+'</div><div class="ur">'+(kind==='box'?IC_BOX:IC_STRIP)+'<span class="u">'+unitW(kind,n)+'</span></div></div>'}
function calc(){
  var a=num('a'),b=num('b'),c=num('c'),x=num('x'),y=num('y');
  var res=$('res'),tot=$('tot');
  var total=a*b*c;
  if(total<=0||x<=0||y<=0){cur='';res.className='res';res.innerHTML=EMPTY;tot.textContent='';$('half').textContent='';closeOv();return}
  var sp=x/y;
  var q=Math.floor(total/sp+1e-9),left=total-q*sp;
  if(left<0)left=0;
  var up=left>=5-1e-9;
  var strips=q+(up?1:0);
  if(strips<1)strips=1;
  var boxes=Math.floor(strips/y),rest=strips-boxes*y;
  var t='';
  if(boxes>0)t+=tile(boxes,'box');
  if(boxes>0&&rest>0)t+='<span class="plus">+</span>';
  if(rest>0)t+=tile(rest,'strip');
  var en=(LANG==='en');
  var sub=(boxes>0)?'<div class="sub">('+stripW(strips)+')</div>':'';
  var h=Math.ceil(strips/2),whole=h,frac=false;
  var hb=Math.floor(whole/y),hr=whole-hb*y,p=[];
  if(hb>0)p.push(boxW(hb));
  if(hr>0)p.push(stripW(hr));
  if(frac)p.push(en?'half a strip':(hr>0?'نص':'نص شريط'));
  var phrase=en?p.join(' and '):(p[0]+p.slice(1).map(function(w){return ' و'+w}).join(''));
  var hs=en?(h===1?'1 strip':fmt(h)+' strips'):(h===1?'شريط':(h===2?'شريطين':fmt(h)+' شرايط'));
  var hf=(en?'Half: ':'نص الكمية: ')+phrase+(hb>0?' ('+hs+')':'');
  var content='<div class="tiles">'+t+'</div>'+sub;
  $('half').textContent=hf;
  cur=content;
  res.className='res ok';
  res.innerHTML=EXP+content;
  $('ovc').innerHTML=content;
  var dropped=(!up&&left>0.001);
  if(en)tot.textContent='Tablets: '+fmt(total)+'  |  Strip: '+fmt(sp)+' tablets'+(dropped?'  |  Dropped: '+fmt(left):'');
  else tot.textContent='الأقراص: '+fmt(total)+'  |  الشريط: '+fmt(sp)+' قرص'+(dropped?'  |  اتشال '+fmt(left)+' قرص':'');
}
function applyLang(l){
  LANG=l;
  var d=document.documentElement;
  d.lang=l;d.dir=(l==='ar')?'rtl':'ltr';
  var els=document.querySelectorAll('[data-t]');
  for(var i=0;i<els.length;i++){els[i].textContent=T[l][els[i].getAttribute('data-t')]}
  $('lg').textContent=(l==='ar')?'EN':'ع';
  try{localStorage.setItem('sf_lang',l)}catch(e){}
  calc();
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  $('tc').setAttribute('content',t==='dark'?'#0C5543':'#0F6E56');
  try{localStorage.setItem('sf_theme',t)}catch(e){}
}
ids.forEach(function(i){
  var el=$(i);
  el.addEventListener('input',calc);
  el.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();e.stopPropagation();openOv()}
  });
});
$('res').addEventListener('click',openOv);
$('ov').addEventListener('click',closeOv);
$('lg').addEventListener('click',function(){applyLang(LANG==='ar'?'en':'ar')});
$('th').addEventListener('click',function(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')});
window.addEventListener('hashchange',function(){if(location.hash!=='#r')$('ov').className='ov'});
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='-'||e.key==='Subtract'||e.key==='\u2212'){e.preventDefault();setPop(false);clearAll();return}
  if(e.key==='Escape'&&popOpen()){setPop(false);return}
  if($('ov').className.indexOf('on')>=0&&(e.key==='Escape'||e.key==='Enter'||e.key===' ')){e.preventDefault();closeOv()}
});
function clearAll(){
  ids.forEach(function(i){$(i).value=''});
  calc();
  $('a').focus();
}
$('rf').addEventListener('click',clearAll);
ids.forEach(function(i){$(i).addEventListener('focus',function(){lastIn=i})});
function moveFocus(d){
  var k=ids.indexOf(lastIn);
  k=(k+d+ids.length)%ids.length;
  $(ids[k]).focus();
}
function popOpen(){return $('infow').classList.contains('open')}
function setPop(on){
  $('infow').classList.toggle('open',on);
  $('info').setAttribute('aria-expanded',on?'true':'false');
}
$('info').addEventListener('click',function(e){e.stopPropagation();setPop(!popOpen())});
$('pop').addEventListener('click',function(e){
  var k=e.target.closest('.key');
  if(!k)return;
  var a=k.getAttribute('data-act');
  setPop(false);
  if(a==='next')moveFocus(1);
  else if(a==='prev')moveFocus(-1);
  else if(a==='enter')openOv();
  else if(a==='esc')closeOv();
  else if(a==='clear')clearAll();
});
document.addEventListener('click',function(e){if(popOpen()&&!e.target.closest('.infow'))setPop(false)});
$('lgo').addEventListener('click',function(){location.reload()});
try{if(location.hash==='#r')history.replaceState(null,'',location.pathname+location.search)}catch(e){}
applyTheme(document.documentElement.getAttribute('data-theme'));
applyLang(document.documentElement.lang==='en'?'en':'ar');
function fa(){$('a').focus()}
fa();
window.addEventListener('load',fa);
window.addEventListener('pageshow',fa);
document.addEventListener('visibilitychange',function(){if(!document.hidden)fa()});
document.addEventListener('click',function(e){if(!/INPUT|BUTTON|LABEL/.test(e.target.tagName)&&!e.target.closest('.res,.ov,.tools,.logo-btn'))fa()});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
